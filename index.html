<style>
@font-face {
  font-family: 'OpenDyslexic';
  font-style: normal; font-display: swap; font-weight: 400;
  src: url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-400-normal.woff2) format('woff2'),
       url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-400-normal.woff) format('woff');
}
@font-face {
  font-family: 'OpenDyslexic';
  font-style: normal; font-display: swap; font-weight: 700;
  src: url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-700-normal.woff2) format('woff2'),
       url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-700-normal.woff) format('woff');
}

:root{
  --radius: 12px;
  --font-moderna: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-classica: 'Lora', Georgia, 'Times New Roman', serif;
  --font-maquina: 'Special Elite', 'Courier New', monospace;
  --font-elite: 'Courier Prime', 'Courier New', monospace;
  --font-codigo: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  --font-tdah: 'Lexend', -apple-system, sans-serif;
  --font-dislexia: 'OpenDyslexic', 'Comic Sans MS', sans-serif;
  --fsize: 17px;
}

/* ===== TEMAS ===== */
body[data-tema="floresta"]{
  --bg:#f3f7f3; --card:#ffffff; --text:#233326; --muted:#5c6b5f;
  --accent:#2e7d32; --accent-2:#66bb6a; --border:#cfe3cf; --danger:#c62828;
}
body[data-tema="sepia"]{
  --bg:#f2e8d5; --card:#faf3e3; --text:#4a3826; --muted:#8a7458;
  --accent:#8b5e34; --accent-2:#c9a06a; --border:#e3d0ac; --danger:#a83232;
}
body[data-tema="claro"]{
  --bg:#f6f6f8; --card:#ffffff; --text:#1c1c1e; --muted:#6e6e73;
  --accent:#3a6df0; --accent-2:#7a9bf5; --border:#e2e2e8; --danger:#d32f2f;
}
body[data-tema="escuro"]{
  --bg:#000000; --card:#111111; --text:#f0f0f0; --muted:#9a9a9a;
  --accent:#4caf50; --accent-2:#81c784; --border:#2a2a2a; --danger:#ef5350;
}
body[data-tema="noite"]{
  --bg:#0d1420; --card:#141d2b; --text:#e4ebf5; --muted:#8291a8;
  --accent:#5b8def; --accent-2:#8fb2f5; --border:#223047; --danger:#ef5350;
}
body[data-tema="contraste"]{
  --bg:#000000; --card:#0a0a0a; --text:#ffffff; --muted:#c9c9c9;
  --accent:#ffd600; --accent-2:#ffe666; --border:#3a3a3a; --danger:#ff5252;
}
body[data-tema="conforto"]{
  --bg:#1c1712; --card:#241d16; --text:#d9c7a8; --muted:#9c8a6f;
  --accent:#c98a4b; --accent-2:#e0ac6f; --border:#3a2f22; --danger:#c9645a;
}
body[data-tema="pastel"]{
  --bg:#f6eef7; --card:#fdf7fd; --text:#3e2f45; --muted:#8a7891;
  --accent:#a165c9; --accent-2:#c79bde; --border:#e6d3ec; --danger:#c2477b;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family: var(--font-tdah);
  overscroll-behavior:none;
  transition: background .25s ease, color .25s ease;
}
body[data-fonte="moderna"] { font-family: var(--font-moderna); }
body[data-fonte="classica"] { font-family: var(--font-classica); }
body[data-fonte="maquina"] { font-family: var(--font-maquina); }
body[data-fonte="elite"] { font-family: var(--font-elite); }
body[data-fonte="codigo"] { font-family: var(--font-codigo); }
body[data-fonte="tdah"] { font-family: var(--font-tdah); }
body[data-fonte="dislexia"] { font-family: var(--font-dislexia); }

#app{ height:100vh; display:flex; flex-direction:column; }

button{ font-family:inherit; }
.icon-btn{
  background:none; border:none; color:var(--text); font-size:1.25rem;
  padding:8px; cursor:pointer; line-height:1; border-radius:8px; flex-shrink:0;
}
.icon-btn:active{ background: rgba(128,128,128,.15); }

/* ===== PROGRESSO DE LEITURA ===== */
#progressBar{
  position:fixed; top:0; left:0; height:3px; background:var(--accent); width:0%;
  z-index:600; transition: width .1s linear;
}

/* ===== TOPBAR ===== */
.topchrome{ flex-shrink:0; transition: opacity .25s ease, transform .25s ease, max-height .25s ease; }
.topchrome.chrome-hidden{ opacity:0; transform:translateY(-12px); pointer-events:none; max-height:0; overflow:hidden; }
.topbar{
  display:flex; align-items:center; gap:2px; padding:8px 4px;
  border-bottom:1px solid var(--border);
}
.topbar h1,.topbar h2{
  flex:1; font-size:1.03rem; margin:0; font-weight:700; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px; min-width:0;
}
.topbar .sub{ font-size:.72rem; color:var(--muted); font-weight:400; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.content{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

/* ===== HOME ===== */
.search-wrap{ padding:10px 14px 4px; }
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--card);
  border:1px solid var(--border); border-radius:999px; padding:10px 14px;
}
.search-box input{
  border:none; background:none; outline:none; flex:1; font-size:.95rem;
  color:var(--text); font-family:inherit;
}

<script>
/* ============================================================
   CONSTANTES
   ============================================================ */
const STORAGE_KEY = 'estudosIA_v1';
const SESSAO_KEY = 'estudosIA_v1_sessao';
const CORES = ['#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#8e24aa','#6d4c41'];
const TEMAS = [
  {id:'floresta', nome:'🌲 Floresta'},
  {id:'sepia', nome:'📜 Sépia'},
  {id:'claro', nome:'☀️ Claro'},
  {id:'escuro', nome:'🌑 Escuro puro'},
  {id:'noite', nome:'🌌 Noite azulada'},
  {id:'contraste', nome:'⚡ Alto contraste'},
  {id:'pastel', nome:'🌸 Pastel suave'},
{id:'conforto', nome:'🕯️ Conforto Ocular'},
];
const FONTES = [
  {id:'tdah', nome:'Foco TDAH'},
  {id:'dislexia', nome:'Dislexia'},
  {id:'moderna', nome:'Moderna'},
  {id:'classica', nome:'Clássica'},
  {id:'elite', nome:'Máq. Elite'},
  {id:'maquina', nome:'Máq. decorativa'},
  {id:'codigo', nome:'Código-fonte'}
];
const TAMANHOS = [
  {px:15, label:'Pequeno'}, {px:17, label:'Médio'}, {px:19, label:'Grande'}, {px:22, label:'Extra grande'}
];

/* ============================================================
   ESTADO DE DADOS (conteúdo) — persistido em STORAGE_KEY
   ============================================================ */
function estadoPadrao(){
  return { disciplinas: [], config: { tema:'floresta', fonte:'tdah', tamanhoIdx:1 }, lixeira: [] };
}

const DIAS_RETENCAO_LIXEIRA = 30;

function migrarTopico(t){
  if(!t.preenchimentos) t.preenchimentos = {};
  if(!t.historico) t.historico = [];
  return t;
}
function migrarDisciplina(d){
  if(!d.subpastas) d.subpastas = [];
  if(!d.topicos) d.topicos = [];
  d.topicos.forEach(migrarTopico);
  d.subpastas.forEach(sp=>{ if(!sp.topicos) sp.topicos=[]; sp.topicos.forEach(migrarTopico); });
  return d;
}

function purgarLixeiraAntiga(estado){
  if(!estado.lixeira || estado.lixeira.length === 0) return;
  const agora = Date.now();
  const limiteMs = DIAS_RETENCAO_LIXEIRA * 24 * 60 * 60 * 1000;
  estado.lixeira = estado.lixeira.filter(item => (agora - item.excluidoEm) < limiteMs);
}

function carregarState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return estadoPadrao();
    const parsed = JSON.parse(raw);
    if(!parsed.disciplinas) return estadoPadrao();
    if(!parsed.config) parsed.config = estadoPadrao().config;
    if(parsed.config.tamanhoIdx === undefined) parsed.config.tamanhoIdx = 1;
    if(!parsed.lixeira) parsed.lixeira = [];
    parsed.disciplinas.forEach(migrarDisciplina);
    purgarLixeiraAntiga(parsed);
    return parsed;
  }catch(e){
    return estadoPadrao();
  }
}

let state = carregarState();
let saveTimer = null;
function salvarState(imediato){
  if(imediato){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return;
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }, 400);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ============================================================
   ESTADO DE SESSÃO/UI (posição, telas, scroll) — persistido em SESSAO_KEY
   ============================================================ */
function sessaoPadrao(){
  return { view:'home', discId:null, subpastaId:null, topicoId:null, modo:'ler', scroll:{} };
}
function carregarSessao(){
  try{
    const raw = localStorage.getItem(SESSAO_KEY);
    if(!raw) return sessaoPadrao();
    const parsed = JSON.parse(raw);
    if(!parsed.scroll) parsed.scroll = {};
    return parsed;
  }catch(e){ return sessaoPadrao(); }
}
let sessao = carregarSessao();
let sessaoTimer = null;
function salvarSessao(imediato){
  if(imediato){
    localStorage.setItem(SESSAO_KEY, JSON.stringify(sessao));
    return;
  }
  clearTimeout(sessaoTimer);
  sessaoTimer = setTimeout(()=>{ localStorage.setItem(SESSAO_KEY, JSON.stringify(sessao)); }, 250);
}

/* ============================================================
   VARIÁVEIS DE NAVEGAÇÃO (espelham a sessão em memória)
   ============================================================ */
let view = sessao.view;
let currentDiscId = sessao.discId;
let currentSubpastaId = sessao.subpastaId;
let currentTopicoId = sessao.topicoId;
let topicoModo = sessao.modo || 'ler';
let searchQuery = '';
let swipeStartTopicId = null;
let chromeHidden = false;

function sincronizarSessao(){
  sessao.view = view;
  sessao.discId = currentDiscId;
  sessao.subpastaId = currentSubpastaId;
  sessao.topicoId = currentTopicoId;
  sessao.modo = topicoModo;
  salvarSessao(false);
}

/* validação: garante que os ids da sessão restaurada ainda existem */
function validarSessaoInicial(){
  if(view === 'home') return;
  const disc = getDisciplina(currentDiscId);
  if(!disc){ view='home'; currentDiscId=null; currentSubpastaId=null; currentTopicoId=null; return; }
  if(view === 'disciplina') return;

  let subp = null;
  if(currentSubpastaId){
    subp = getSubpasta(disc, currentSubpastaId);
    if(!subp){ view='disciplina'; currentSubpastaId=null; currentTopicoId=null; return; }
  }
  if(view === 'subpasta'){
    if(!subp){ view='disciplina'; }
    return;
  }
  if(view === 'topico'){
    const container = subp ? subp.topicos : disc.topicos;
    const top = container.find(t=>t.id===currentTopicoId);
    if(!top){ view = subp ? 'subpasta' : 'disciplina'; currentTopicoId=null; return; }
    swipeStartTopicId = currentTopicoId;
  }
}
validarSessaoInicial();

function aplicarConfigVisual(){
  document.body.setAttribute('data-tema', state.config.tema);
  document.body.setAttribute('data-fonte', state.config.fonte);
  const px = TAMANHOS[state.config.tamanhoIdx].px;
  document.documentElement.style.setProperty('--fsize', px + 'px');
}

function getDisciplina(id){ return state.disciplinas.find(d=>d.id===id); }
function getSubpasta(disc, id){ return disc ? disc.subpastas.find(s=>s.id===id) : null; }
function getContainerAtual(){
  const disc = getDisciplina(currentDiscId);
  if(!disc) return null;
  if(currentSubpastaId){
    const sp = getSubpasta(disc, currentSubpastaId);
    return sp ? sp.topicos : null;
  }
  return disc.topicos;
}
function getTopico(container, id){ return container ? container.find(t=>t.id===id) : null; }

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function render(){
  aplicarConfigVisual();
  const app = document.getElementById('app');
  if(view === 'home') app.innerHTML = renderHome();
  else if(view === 'disciplina') app.innerHTML = renderDisciplina();
  else if(view === 'subpasta') app.innerHTML = renderSubpasta();
  else if(view === 'lixeira') app.innerHTML = renderLixeira();
  else if(view === 'topico') app.innerHTML = renderTopico();

  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('focusFab').classList.toggle('show', view==='topico' && chromeHidden);

  if(view === 'topico' && topicoModo === 'ler'){
    renderMarkdownNoElemento();
    requestAnimationFrame(restaurarScrollLer);
  }
  if(view === 'topico' && topicoModo === 'editar'){
    const ta = document.getElementById('editorTexto');
    if(ta){
      requestAnimationFrame(()=>{
        restaurarScrollEditor(ta);
        ta.focus({preventScroll:true});
      });
    }
  }
  sincronizarSessao();
}

function buscarTopicos(q){
  const out = [];
  state.disciplinas.forEach(d=>{
    d.topicos.forEach(t=>{
      const alvo = (t.nome + ' ' + (t.conteudo||'')).toLowerCase();
      if(alvo.includes(q)) out.push({discId:d.id, subpastaId:null, caminho:d.nome, cor:d.cor, topico:t});
    });
    d.subpastas.forEach(sp=>{
      sp.topicos.forEach(t=>{
        const alvo = (t.nome + ' ' + (t.conteudo||'')).toLowerCase();
        if(alvo.includes(q)) out.push({discId:d.id, subpastaId:sp.id, caminho:`${d.nome} › ${sp.nome}`, cor:d.cor, topico:t});
      });
    });
  });
  return out;
}

function renderLixeira(){
  const itens = [...state.lixeira].sort((a,b)=>b.excluidoEm - a.excluidoEm);
  const ICONE_TIPO = { disciplina:'📘', subpasta:'📁', topico:'📄' };

  const lista = itens.length === 0
    ? `<div class="empty-state">A lixeira está vazia.</div>`
    : itens.map(item => {
        const diasRestantes = Math.max(0, DIAS_RETENCAO_LIXEIRA - Math.floor((Date.now()-item.excluidoEm)/(24*60*60*1000)));
        let caminho = '';
        if(item.tipo === 'subpasta') caminho = item.discNomeOriginal || '';
        if(item.tipo === 'topico') caminho = [item.discNomeOriginal, item.subpastaNomeOriginal].filter(Boolean).join(' › ');
        return `
        <div class="item-row">
          <div class="folder-ico">${ICONE_TIPO[item.tipo]||'🚮️'}</div>
          <div class="item-main">
            <div class="item-title">${escapeHtml(item.nome)}</div>
            <div class="item-sub">${caminho ? escapeHtml(caminho)+' · ' : ''}expira em ${diasRestantes} dia${diasRestantes===1?'':'s'}</div>
          </div>
          <button class="icon-btn" onclick="restaurarDaLixeira('${item.id}')" title="Restaurar">♻️</button>
          <button class="icon-btn" onclick="excluirDefinitivoDaLixeira('${item.id}')" title="Excluir definitivamente">🚮️</button>
        </div>
      `;}).join('');

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="voltarHome()">←</button>
      <h2>🚮️ Lixeira</h2>
    </div>
    <div class="content">
      <div class="list" style="padding-top:14px">${lista}</div>
    </div>
    ${itens.length > 0 ? `
    <div class="fab-row">
      <button class="btn-add secondary" onclick="esvaziarLixeira()">Esvaziar lixeira</button>
    </div>` : ''}
  `;
}

function restaurarDaLixeira(id){
  const item = state.lixeira.find(i=>i.id===id);
  if(!item) return;

  if(item.tipo === 'disciplina'){
    state.disciplinas.push(item.dados);
  } else if(item.tipo === 'subpasta'){
    const disc = getDisciplina(item.discIdOriginal);
    if(!disc){ mostrarToast('Não foi possível restaurar: a disciplina original não existe mais.'); return; }
    disc.subpastas.push(item.dados);
  } else if(item.tipo === 'topico'){
    const disc = getDisciplina(item.discIdOriginal);
    if(!disc){ mostrarToast('Não foi possível restaurar: a disciplina original não existe mais.'); return; }
    const alvoContainer = item.subpastaIdOriginal ? getSubpasta(disc, item.subpastaIdOriginal) : disc;
    if(!alvoContainer){ mostrarToast('Não foi possível restaurar: a subpasta original não existe mais.'); return; }
    alvoContainer.topicos.push(item.dados);
  }

  state.lixeira = state.lixeira.filter(i=>i.id!==id);
  salvarState(true);
  render();
  mostrarToast('Restaurado com sucesso!');
}

function excluirDefinitivoDaLixeira(id){
  if(!confirm('Excluir definitivamente? Isso não pode ser desfeito.')) return;
  state.lixeira = state.lixeira.filter(i=>i.id!==id);
  salvarState(true);
  render();
}

function esvaziarLixeira(){
  if(!confirm('Excluir definitivamente todos os itens da lixeira? Isso não pode ser desfeito.')) return;
  state.lixeira = [];
  salvarState(true);
  render();
  mostrarToast('Lixeira esvaziada');
}

  const modeTabsHtml = `

    </div>
  `;

  const corpo = topicoModo === 'editar'
    ? `
      <div class="editor-wrap">
        <textarea id="editorTexto"
          placeholder="Cole aqui o texto em Markdown vindo da IA. Use $formula$ para LaTeX inline, $$formula$$ para bloco, e {{ }} para criar um campo de preenchimento."

          onscroll="onEditorScroll(this)"

      </div>
    `
    : `
      <div class="reader-wrap" id="readerWrap" onclick="onReaderTap(event)" onscroll="onReaderScroll(this)">
        <div class="markdown-body" id="mdBody"></div>
      </div>
    `;

  return `
    <div class="topchrome ${chromeHidden?'chrome-hidden':''}" id="topicoChrome">
      <div class="topbar">
        <button class="icon-btn" onclick="voltarDoTopico()">←</button>
        <h2>${escapeHtml(top.nome)}<span class="sub">${escapeHtml(caminho)}</span></h2>
        <button class="icon-btn" onclick="alternarFoco()" title="Modo foco">🛸</button>
        ${renderDropdownTopico()}
      </div>
      ${modeTabsHtml}
      ${topicoModo==='editar' ? renderToolbarEditor() : ''}
    </div>
    ${corpo}
  `;
}

    {sep:true},

    {ic:'H2', tip:'Título 2', fn:"mdLinha('## ')"},
    {ic:'H3', tip:'Título 3', fn:"mdLinha('### ')"},
    {sep:true},
    {ic:'•', tip:'Lista', fn:"mdLinha('- ')"},

  ).join('')}</div>`;
}

let conteudoAoEntrarNoEditor = null;
const MAX_VERSOES_HISTORICO = 20;

function mudarModo(modo){
  fecharDropdowns();
  if(topicoModo === 'editar'){
    const ta = document.getElementById('editorTexto');
    if(ta){
      const disc = getDisciplina(currentDiscId);
      const container = getContainerAtual();
      const top = getTopico(container, currentTopicoId);
      if(conteudoAoEntrarNoEditor !== null && ta.value !== conteudoAoEntrarNoEditor){
        if(!top.historico) top.historico = [];
        top.historico.unshift({ conteudo: conteudoAoEntrarNoEditor, data: Date.now() });
        if(top.historico.length > MAX_VERSOES_HISTORICO) top.historico.length = MAX_VERSOES_HISTORICO;
      }
      top.conteudo = ta.value;
      top.atualizadoEm = Date.now();
      salvarState(true);
      guardarScroll('editor', ta.scrollTop, ta.selectionStart);
    }
  } else if(topicoModo === 'ler'){
    const rw = document.getElementById('readerWrap');
    if(rw) guardarScroll('ler', rw.scrollTop);
  }
  if(modo === 'editar'){
    const container = getContainerAtual();
    const top = getTopico(container, currentTopicoId);
    conteudoAoEntrarNoEditor = top ? (top.conteudo || '') : '';
    undoStack = []; redoStack = [];
  }
  topicoModo = modo;
  chromeHidden = false;
  render();
}

function guardarScroll(chave, valor, cursor){
  if(!sessao.scroll[currentTopicoId]) sessao.scroll[currentTopicoId] = {};
  sessao.scroll[currentTopicoId][chave] = valor;
  if(cursor !== undefined) sessao.scroll[currentTopicoId].cursor = cursor;
  salvarSessao(false);
}

function restaurarScrollLer(){
  const rw = document.getElementById('readerWrap');
  if(!rw) return;
  const dados = sessao.scroll[currentTopicoId];
  if(dados && dados.ler) rw.scrollTop = dados.ler;
}
function restaurarScrollEditor(ta){
  const dados = sessao.scroll[currentTopicoId];
  if(dados){
    if(dados.editor) ta.scrollTop = dados.editor;
    if(dados.cursor !== undefined){
      try{ ta.setSelectionRange(dados.cursor, dados.cursor); }catch(e){}
    }
  }
}

let undoStack = [];
let redoStack = [];
let undoBurstAtivo = false;
let undoDebounceTimer = null;
const MAX_UNDO_HISTORICO = 200;

function onEditorInput(valor){
  const container = getContainerAtual();
  const top = getTopico(container, currentTopicoId);
  const valorAnterior = top.conteudo;
  if(valorAnterior !== valor){
    clearTimeout(undoDebounceTimer);
    if(!undoBurstAtivo){
      undoStack.push(valorAnterior);
      if(undoStack.length > MAX_UNDO_HISTORICO) undoStack.shift();
      redoStack = [];
      undoBurstAtivo = true;
    }
    undoDebounceTimer = setTimeout(()=>{ undoBurstAtivo = false; }, 700);
  }
  top.conteudo = valor;
  top.atualizadoEm = Date.now();
  salvarState(true); // gravação imediata a cada tecla — sem janela de espera
}

function onEditorInputSemHistorico(valor){
  const container = getContainerAtual();
  const top = getTopico(container, currentTopicoId);
  top.conteudo = valor;
  top.atualizadoEm = Date.now();
  salvarState(true);
}

function desfazerEdicao(){
  const ta = document.getElementById('editorTexto');
  if(!ta || undoStack.length === 0) return;
  const atual = ta.value;
  const anterior = undoStack.pop();
  redoStack.push(atual);
  ta.value = anterior;
  onEditorInputSemHistorico(anterior);
  undoBurstAtivo = false;
  ta.focus();
}

function refazerEdicao(){
  const ta = document.getElementById('editorTexto');
  if(!ta || redoStack.length === 0) return;
  const atual = ta.value;
  const proximo = redoStack.pop();
  undoStack.push(atual);
  ta.value = proximo;
  onEditorInputSemHistorico(proximo);
  undoBurstAtivo = false;
  ta.focus();
}

/* ---------- FERRAMENTAS DO EDITOR (toolbar) ---------- */
function mdWrap(prefixo, sufixo, textoPadrao){
  const ta = document.getElementById('editorTexto');
  if(!ta) return;
  const ini = ta.selectionStart, fim = ta.selectionEnd;
  const selecionado = ta.value.slice(ini, fim);
  const meio = selecionado || textoPadrao || '';
  const novoTrecho = prefixo + meio + sufixo;
  ta.value = ta.value.slice(0, ini) + novoTrecho + ta.value.slice(fim);
  const novoInicio = ini + prefixo.length;
  ta.setSelectionRange(novoInicio, novoInicio + meio.length);
  ta.focus();
  onEditorInput(ta.value);
  undoBurstAtivo = false;
}

function mdBloco(prefixo, sufixo, textoPadrao){
  const ta = document.getElementById('editorTexto');
  if(!ta) return;
  const ini = ta.selectionStart, fim = ta.selectionEnd;
  const precisaQuebraAntes = ini>0 && ta.value[ini-1] !== '\n';
  const selecionado = ta.value.slice(ini, fim) || textoPadrao || '';
  const bloco = (precisaQuebraAntes?'\n':'') + prefixo + selecionado + sufixo;
  ta.value = ta.value.slice(0, ini) + bloco + ta.value.slice(fim);
  const offset = ini + (precisaQuebraAntes?1:0) + prefixo.length;
  ta.setSelectionRange(offset, offset + selecionado.length);
  ta.focus();
  onEditorInput(ta.value);
  undoBurstAtivo = false;
}

function mdLinha(prefixo){
  const ta = document.getElementById('editorTexto');
  if(!ta) return;
  const ini = ta.selectionStart;
  const precisaQuebraAntes = ini>0 && ta.value[ini-1] !== '\n';
  const inserir = (precisaQuebraAntes?'\n':'') + prefixo;
  ta.value = ta.value.slice(0, ini) + inserir + ta.value.slice(ini);
  const novaPos = ini + inserir.length;
  ta.setSelectionRange(novaPos, novaPos);
  ta.focus();
  onEditorInput(ta.value);
  undoBurstAtivo = false;
}

function mdTabela(){
  const modelo = '\n| Coluna 1 | Coluna 2 | Coluna 3 |\n| --- | --- | --- |\n|  |  |  |\n|  |  |  |\n';
  const ta = document.getElementById('editorTexto');
  if(!ta) return;
  const ini = ta.selectionStart;
  const precisaQuebraAntes = ini>0 && ta.value[ini-1] !== '\n';
  const inserir = (precisaQuebraAntes?'\n':'') + modelo;
  ta.value = ta.value.slice(0, ini) + inserir + ta.value.slice(ini);
  const novaPos = ini + inserir.length;
  ta.setSelectionRange(novaPos, novaPos);
  ta.focus();
  onEditorInput(ta.value);
  undoBurstAtivo = false;
}

/* ---------- SWIPE ENTRE TÓPICOS (modo leitura) ---------- */
let touchStartX = null, touchStartY = null;
document.addEventListener('touchstart', (e)=>{
  if(view!=='topico' || topicoModo!=='ler') return;
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', (e)=>{
  if(view!=='topico' || topicoModo!=='ler' || touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4){
    navegarTopicoSwipe(dx < 0 ? 1 : -1);
  }
}, {passive:true});

function navegarTopicoSwipe(direcao){
  const container = getContainerAtual();
  if(!container || container.length < 2) return;
  const idx = container.findIndex(t=>t.id===currentTopicoId);
  if(idx === -1) return;
  const novoIdx = (idx + direcao + container.length) % container.length;
  const novoTopico = container[novoIdx];

  currentTopicoId = novoTopico.id;
  topicoModo = (novoTopico.conteudo && novoTopico.conteudo.trim().length>0) ? 'ler' : 'editar';
  if(topicoModo === 'editar'){
    conteudoAoEntrarNoEditor = novoTopico.conteudo || '';
    undoStack = []; redoStack = [];
  }
  render();

  if(novoTopico.id === swipeStartTopicId) dispararFlashRefoco();
}

function dispararFlashRefoco(){
  const overlay = document.getElementById('flashOverlay');
  overlay.classList.add('flash-active');
  setTimeout(()=>overlay.classList.remove('flash-active'), 160);
  const toast = document.getElementById('cycleToast');

/* ---------- RENDER MARKDOWN + LATEX + INTERATIVIDADE ---------- */
function renderMarkdownNoElemento(){
  const container = getContainerAtual();
  const top = getTopico(container, currentTopicoId);
  const alvo = document.getElementById('mdBody');
  if(!alvo) return;

  const bruto = (top && top.conteudo) ? top.conteudo : '';
  if(!bruto.trim()){
    alvo.innerHTML = `<div class="reader-empty">Este tópico ainda não tem conteúdo.<br>Toque em "📝 Editar" para colar seu texto.</div>`;
    return;
  }

  const {html, totalBlanks} = markdownComLatexEBlanks(bruto, top.preenchimentos || {});
  alvo.innerHTML = html;

  if(window.renderMathInElement){
    try{
      renderMathInElement(alvo, {
        delimiters: [
          {left:'$$', right:'$$', display:true},
          {left:'$', right:'$', display:false}
        ],
        throwOnError:false
      });
    }catch(e){ /* silencioso */ }
  }

  // checkboxes interativos (task list)
  const boxes = alvo.querySelectorAll('input[type="checkbox"]');
  boxes.forEach((box, i)=>{
    box.disabled = false;
    box.addEventListener('change', ()=> onToggleCheckbox(top, i, box.checked));
  });

  // campos de preenchimento interativos
  const campos = alvo.querySelectorAll('input.campo-input');
  campos.forEach(inp=>{
    inp.addEventListener('input', ()=>{
      if(!top.preenchimentos) top.preenchimentos = {};
      top.preenchimentos[inp.dataset.idx] = inp.value;
      salvarState(false);
    });
  });
}

function onToggleCheckbox(top, idx, marcado){
  let contador = -1;
  top.conteudo = top.conteudo.replace(/\[( |x|X)\]/g, (m)=>{
    contador++;
    return contador === idx ? (marcado ? '[x]' : '[ ]') : m;
  });
  top.atualizadoEm = Date.now();
  salvarState(false);
}

function markdownComLatexEBlanks(texto, preenchimentos){
  const mathStore = [];
  const blankStore = [];

  let protegido = texto.replace(/\$\$([\s\S]+?)\$\$/g, (m)=>{
    mathStore.push(m); return '@@MATH' + (mathStore.length-1) + '@@';
  });
  protegido = protegido.replace(/\$([^\$\n]+?)\$/g, (m)=>{
    mathStore.push(m); return '@@MATH' + (mathStore.length-1) + '@@';
  });
  protegido = protegido.replace(/\{\{(.*?)\}\}/g, (m, placeholder)=>{
    blankStore.push(placeholder); return '@@BLANK' + (blankStore.length-1) + '@@';
  });

  let html;
  try{ html = marked.parse(protegido, { gfm:true, breaks:true }); }
  catch(e){ html = '<p>' + escapeHtml(texto) + '</p>'; }

  html = html.replace(/@@MATH(\d+)@@/g, (m, i)=>{
    const original = mathStore[parseInt(i,10)];
    return original ? escapeHtml(original) : m;
  });

  html = html.replace(/@@BLANK(\d+)@@/g, (m, i)=>{
    const idx = parseInt(i,10);
    const placeholder = blankStore[idx] || '';
    const valorSalvo = (preenchimentos && preenchimentos[idx]) || '';
    return `<input type="text" class="campo-input" data-idx="${idx}" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(valorSalvo)}">`;
  });

  return {html, totalBlanks: blankStore.length};
}

   ============================================================ */

function executarCalculo(){
  const expr = document.getElementById('calcInput').value;
  try{
    const resultado = avaliarExpressaoSegura(expr);
    document.getElementById('calcDisplay').innerText = formatarNumero(resultado);
  }catch(e){
    document.getElementById('calcDisplay').innerText = 'Erro na expressão';
  }
}

function formatarNumero(n){
  if(!isFinite(n)) return 'Erro';
  const arredondado = Math.round(n * 1e8) / 1e8;
  return String(arredondado);
}

function avaliarExpressaoSegura(exprOriginal){
  let expr = exprOriginal.replace(/,/g, '.').replace(/×/g,'*').replace(/÷/g,'/').replace(/\s+/g,'');
  if(expr === '') throw new Error('vazio');
  if(!/^[0-9+\-*/^().]+$/.test(expr)) throw new Error('caracteres inválidos');

  let pos = 0;
  function peek(){ return expr[pos]; }
  function consome(){ return expr[pos++]; }

  function parseExpr(){
    let v = parseTermo();
    while(peek()==='+' || peek()==='-'){
      const op = consome(); const v2 = parseTermo();
      v = op==='+' ? v+v2 : v-v2;
    }
    return v;
  }
  function parseTermo(){
    let v = parseFator();
    while(peek()==='*' || peek()==='/'){
      const op = consome(); const v2 = parseFator();
      v = op==='*' ? v*v2 : v/v2;
    }
    return v;
  }
  function parseFator(){
    let v = parseUnario();
    while(peek()==='^'){ consome(); const v2 = parseUnario(); v = Math.pow(v, v2); }
    return v;
  }
  function parseUnario(){
    if(peek()==='-'){ consome(); return -parseUnario(); }
    if(peek()==='+'){ consome(); return parseUnario(); }
    return parsePrimario();
  }
  function parsePrimario(){
    if(peek()==='('){
      consome();
      const v = parseExpr();
      if(peek()===')') consome(); else throw new Error('parêntese não fechado');
      return v;
    }
    const inicio = pos;
    while(pos<expr.length && /[0-9.]/.test(peek())) pos++;
    if(inicio===pos) throw new Error('número esperado');
    return parseFloat(expr.slice(inicio,pos));
  }

  const resultado = parseExpr();
  if(pos !== expr.length) throw new Error('expressão inválida');
  return resultado;
}

/* ============================================================
   EXPORTAR TABELAS PARA EXCEL
   ============================================================ */
function exportarTabelasExcel(){
  const container = getContainerAtual();
  const top = getTopico(container, currentTopicoId);
  const texto = (top && top.conteudo) || '';

  if(typeof XLSX === 'undefined'){
    mostrarToast('Não foi possível carregar o módulo de Excel (sem internet?).');
    return;
  }

  const tabelas = extrairTabelasMarkdown(texto);
  if(tabelas.length === 0){
    mostrarToast('Nenhuma tabela encontrada neste tópico.');
    return;
  }

  try{
    const wb = XLSX.utils.book_new();
    tabelas.forEach((linhas, i)=>{
      const ws = XLSX.utils.aoa_to_sheet(linhas);
      XLSX.utils.book_append_sheet(wb, ws, `Tabela ${i+1}`.slice(0,31));
    });
    const nomeArquivo = `${(top.nome||'topico').replace(/[\\/:*?"<>|]/g,'_')}_tabelas.xlsx`;
    XLSX.writeFile(wb, nomeArquivo);
    mostrarToast(`${tabelas.length} tabela(s) exportada(s)!`);
  }catch(e){
    mostrarToast('Erro ao gerar o Excel.');
  }
}

function extrairTabelasMarkdown(texto){
  const linhas = texto.split('\n');
  const tabelas = [];

  function ehLinhaSeparadora(l){
    return /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/.test(l) && l.includes('-');
  }
  function paraLinhaDeCelulas(l){
    let s = l.trim();
    if(s.startsWith('|')) s = s.slice(1);
    if(s.endsWith('|')) s = s.slice(0,-1);
    return s.split('|').map(c=>c.trim());
  }

  let i = 0;
  while(i < linhas.length){
    const linhaAtual = linhas[i];
    const proximaLinha = linhas[i+1] || '';
    if(linhaAtual.includes('|') && ehLinhaSeparadora(proximaLinha)){
      const linhasTabela = [linhaAtual];
      i += 2; // pula a linha de cabeçalho já capturada e a linha separadora
      while(i < linhas.length && linhas[i].includes('|') && linhas[i].trim() !== ''){
        linhasTabela.push(linhas[i]);
        i++;
      }
      tabelas.push(linhasTabela.map(paraLinhaDeCelulas));
    } else {
      i++;
    }
  }
  return tabelas;
}

/* ============================================================
   HISTÓRICO DE VERSÕES
   ============================================================ */
function abrirHistorico(){
  const container = getContainerAtual();
  const top = getTopico(container, currentTopicoId);
  const lista = document.getElementById('historicoLista');

  if(!top.historico || top.historico.length === 0){
    lista.innerHTML = `<div class="historico-vazio">Nenhuma versão anterior salva ainda.<br>Uma versão é guardada automaticamente sempre que você edita e sai do modo Editar.</div>`;
  } else {
    lista.innerHTML = top.historico.map((v, idx) => {
      const data = new Date(v.data);
      const dataFmt = data.toLocaleDateString('pt-BR') + ' às ' + data.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      const preview = (v.conteudo || '').trim().slice(0, 160) || '(vazio)';
      return `
        <div class="historico-item">
          <div class="historico-data">${dataFmt}</div>
          <div class="historico-preview">${escapeHtml(preview)}${v.conteudo.length>160?'…':''}</div>
          <button class="historico-restaurar" onclick="restaurarVersao(${idx})">Restaurar esta versão</button>
        </div>
      `;
    }).join('');
  }
  document.getElementById('historicoBackdrop').classList.add('open');
}
function fecharHistorico(){
  document.getElementById('historicoBackdrop').classList.remove('open');
}
function restaurarVersao(idx){
  const container = getContainerAtual();
  const top = getTopico(container, currentTopicoId);
  const versao = top.historico[idx];
  if(!versao) return;
  if(!confirm('Restaurar esta versão? O texto atual será salvo no histórico antes de ser substituído.')) return;

  if(!top.historico) top.historico = [];
  top.historico.unshift({ conteudo: top.conteudo, data: Date.now() });
  if(top.historico.length > MAX_VERSOES_HISTORICO) top.historico.length = MAX_VERSOES_HISTORICO;

  top.conteudo = versao.conteudo;
  top.atualizadoEm = Date.now();
  salvarState(true);

  fecharHistorico();
  topicoModo = 'ler';
  conteudoAoEntrarNoEditor = null;
  render();
  mostrarToast('Versão restaurada!');
}

/* ============================================================
   BACKUP / RESTAURAR
   ============================================================ */
function exportarBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const agora = new Date();
  const ts = agora.toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url;
  a.download = `Estudos_Backup_${ts}.json`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('Backup exportado!');
}

document.getElementById('fileImport').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const conteudo = ev.target.result;
      const parsed = JSON.parse(conteudo);
      if(!parsed.disciplinas) throw new Error('formato inválido');
      if(!confirm('Isso irá substituir todos os dados atuais pelo backup selecionado. Continuar?')) return;
      state = parsed;
      if(!state.config) state.config = estadoPadrao().config;
      if(state.config.tamanhoIdx === undefined) state.config.tamanhoIdx = 1;
      state.disciplinas.forEach(migrarDisciplina);
      salvarState(true);
      view = 'home'; currentDiscId=null; currentSubpastaId=null; currentTopicoId=null;
      searchQuery = '';
      sessao = sessaoPadrao();
      salvarSessao(true);
      render();
      mostrarToast('Backup restaurado com sucesso!');
    }catch(err){
      alert('Erro: arquivo JSON inválido ou corrompido.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function escapeHtml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
